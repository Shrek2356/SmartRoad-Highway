project_name: Site Safety OpenRisk Open RiskSpec Experiment
random_seed: 42

risk_operators:
  path: configs/risk_operators.yaml

mllm:
  backend: openai_compatible
  api_key_env: LOCAL_QWEN_API_KEY
  base_url_env: LOCAL_QWEN_BASE_URL
  model_env: LOCAL_QWEN_MODEL
  timeout_seconds: 900
  # 网络层重试；格式异常由编排器的无图 JSON 修复分支处理。
  max_retries: 1
  temperature: 0.0
  trust_env: false
  # llama.cpp 当前版本对 response_format=json_object 返回502；由提示词约束JSON。
  use_response_format: false
  payload_extra:
    # 1200 会在小模型忽略“单 RiskSpec”约束时截断长 JSON；1800 留出闭合对象的余量。
    max_tokens: 1800
  system_prompt: >-
    你是一名谨慎的施工现场视觉安全分析助手。只根据输入图像中的可见证据判断，
    不推测设备运行状态、人员权限、施工阶段或不可见信息。输出必须是严格JSON。

report_llm:
  # 本实验只比较发现、定位和核验；管理报告使用确定性模板，避免文本生成干扰耗时。
  enabled: false
  backend: openai_compatible
  generated_by: qwen_local
  api_key_env: LOCAL_QWEN_API_KEY
  base_url_env: LOCAL_QWEN_BASE_URL
  model_env: LOCAL_QWEN_MODEL
  timeout_seconds: 900
  max_retries: 0
  temperature: 0.1
  payload_extra:
    max_tokens: 1200
  use_response_format: false
  trust_env: false
  memory_paths:
    - examples/risk_catalog.json
  system_prompt: >-
    你负责根据已经锁定的视觉核验JSON整理施工安全报告、风险摘要和整改建议。
    视觉核验JSON是唯一视觉事实来源，不得改变风险是否成立、置信度、可见证据和人工复核要求。

sam3:
  backend: bridge
  bridge_module: integrations.sam3_bridge_user
  bridge_class: SAM3Bridge
  init_kwargs:
    repo_path: 'E:\SAM3_MAIN\sam3-main'
    checkpoint: 'E:\SAM3_MAIN\SAM3\sam3.pt'
    device: cuda
    confidence_threshold: 0.20
    amp_dtype: bfloat16

clip:
  enabled: true
  backend: bridge
  bridge_module: integrations.clip_bridge_user
  bridge_class: CLIPBridge
  init_kwargs:
    model_name: ViT-L-14
    checkpoint: 'C:\Users\SYS03\.cache\clip\ViT-L-14.pt'
    device: cuda
    precision: fp16
  minimum_consistency_score: 0.20

risk_catalog:
  path: examples/risk_catalog.json
  include_all_core: true
  # 零成本本地批测保留全部9类核心风险，去掉只用于异常暴露实验的干扰候选。
  distractor_count: 0
  allow_open_discovery: true

pipeline:
  # 隔离演示前端审批产生的阈值；实验不能继承demo中的0.95安全帽阈值。
  threshold_overrides_path: configs/threshold_overrides_eval_empty.json
  # 逐实体、逐规则审核作为召回补充分支，接入完整RiskSpec/SAM3链路。
  structured_risk_audit:
    enabled: true
    minimum_confidence: 0.25
    # llama.cpp本地服务单请求限制为最多5张图；PPE与临边视图分轮审核后合并。
    specialized_views:
      enabled: true
      upscale_min_side: 448
      scene_tiling:
        enabled: true
        columns: 3
        overlap_ratio: 0.15
      ppe_roi:
        enabled: true
        prompt: person
        min_score: 0.45
        max_people: 4
  # 默认继续执行空间关系；消融时可把near放入advisory_types。
  relation_policy:
    advisory_types: []
  screening_region_views:
    max_crops: 3
    crop_margin_ratio: 0.25
  compact_open_discovery: true
  two_stage_open_discovery: true
  dual_view_open_discovery: true
  structure_each_discovered_hazard: true
  minimum_discovery_confidence: 0.25
  retry_empty_anchor_scene: true
  person_precheck:
    enabled: true
    prompt: person
    min_score: 0.45
    max_crops: 4
    # llama.cpp本地服务单请求最多保留全景+4个人员视图。
    max_total_views: 5
    crop_margin_ratio: 0.25
    upscale_min_side: 448
  # SAM3风险提示漏掉人员时，复用同图人员预检掩码作为安全帽关联主体。
  person_precheck_fallback: true
  segment_statuses: [present, uncertain]
  min_mllm_candidate_confidence: 0.25
  min_sam3_score: 0.20
  max_sam3_tasks: 24
  run_second_pass: true
  save_entity_masks: true
  save_risk_crops: true
  # 本地8K上下文只保留一组最关键证据图（原图+overlay+crop）。
  second_pass_max_overlays: 1
  # 小模型逐风险查看原图、叠加图和裁剪图，避免多个风险的证据互相串线。
  second_pass_per_risk: true
  # 第一遍与SAM3/CLIP均给出强证据时，第二遍不能静默清零；保留风险并转人工复核。
  strong_evidence_preservation:
    enabled: true
    min_first_pass_confidence: 0.85
    min_evidence_score: 0.70
  relation_defaults:
    horizontal_overlap_threshold: 0.25
    near_distance_ratio: 0.30
    # 大型机械中心很远时，使用人员框到机械外轮廓的自适应危险区补充判断。
    near_edge_gap_machine_ratio: 0.35
    overlap_threshold: 0.10
    inside_threshold: 0.50
    allow_missing_from_non_detection: false
    allow_missing_from_visible_zone: true
    confirmed_absence_confidence_cap: 0.90
  mask_defaults:
    projected_width_expand_ratio: 0.15
    projected_max_object_height_ratio: 4.0
    projected_max_image_height_ratio: 0.55
