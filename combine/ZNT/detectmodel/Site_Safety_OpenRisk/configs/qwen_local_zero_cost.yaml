project_name: Site Safety OpenRisk Training-Free
random_seed: 42

risk_operators:
  path: configs/risk_operators.yaml

mllm:
  backend: openai_compatible
  api_key_env: LOCAL_QWEN_API_KEY
  base_url_env: LOCAL_QWEN_BASE_URL
  model_env: LOCAL_QWEN_MODEL
  timeout_seconds: 900
  max_retries: 0
  temperature: 0.1
  trust_env: false
  # llama.cpp 当前版本对 response_format=json_object 返回502；由提示词约束JSON。
  use_response_format: false
  payload_extra:
    max_tokens: 1800
  system_prompt: >-
    你是一名谨慎的施工现场视觉安全分析助手。只根据输入图像中的可见证据判断，
    不推测设备运行状态、人员权限、施工阶段或不可见信息。输出必须是严格JSON。

report_llm:
  enabled: true
  backend: openai_compatible
  generated_by: qwen_local
  api_key_env: LOCAL_QWEN_API_KEY
  base_url_env: LOCAL_QWEN_BASE_URL
  model_env: LOCAL_QWEN_MODEL
  timeout_seconds: 900
  max_retries: 0
  temperature: 0.1
  payload_extra:
    max_tokens: 1200
  use_response_format: false
  trust_env: false
  memory_paths:
    - examples/risk_catalog.json
  system_prompt: >-
    你负责根据已经锁定的视觉核验JSON整理施工安全报告、风险摘要和整改建议。
    视觉核验JSON是唯一视觉事实来源，不得改变风险是否成立、置信度、可见证据和人工复核要求。

sam3:
  backend: bridge
  bridge_module: integrations.sam3_bridge_user
  bridge_class: SAM3Bridge
  init_kwargs:
    repo_path: 'E:\SAM3_MAIN\sam3-main'
    checkpoint: 'E:\SAM3_MAIN\SAM3\sam3.pt'
    device: cuda
    confidence_threshold: 0.20
    amp_dtype: bfloat16

clip:
  enabled: true
  backend: bridge
  bridge_module: integrations.clip_bridge_user
  bridge_class: CLIPBridge
  init_kwargs:
    model_name: ViT-L-14
    checkpoint: 'C:\Users\SYS03\.cache\clip\ViT-L-14.pt'
    device: cuda
    precision: fp16
  minimum_consistency_score: 0.20

risk_catalog:
  path: examples/risk_catalog.json
  include_all_core: true
  # 零成本本地批测保留全部9类核心风险，去掉只用于异常暴露实验的干扰候选。
  distractor_count: 0
  allow_open_discovery: true

pipeline:
  segment_statuses: [present, uncertain]
  min_mllm_candidate_confidence: 0.25
  min_sam3_score: 0.20
  max_sam3_tasks: 24
  run_second_pass: true
  save_entity_masks: true
  save_risk_crops: true
  # 本地8K上下文只保留一组最关键证据图（原图+overlay+crop）。
  second_pass_max_overlays: 1
  # 小模型逐风险查看原图、叠加图和裁剪图，避免多个风险的证据互相串线。
  second_pass_per_risk: true
  # 第一遍与SAM3/CLIP均给出强证据时，第二遍不能静默清零；保留风险并转人工复核。
  strong_evidence_preservation:
    enabled: true
    min_first_pass_confidence: 0.85
    min_evidence_score: 0.70
  relation_defaults:
    horizontal_overlap_threshold: 0.25
    near_distance_ratio: 0.30
    overlap_threshold: 0.10
    inside_threshold: 0.50
    allow_missing_from_non_detection: false
    allow_missing_from_visible_zone: true
    confirmed_absence_confidence_cap: 0.90
  mask_defaults:
    projected_width_expand_ratio: 0.15
    projected_max_object_height_ratio: 4.0
    projected_max_image_height_ratio: 0.55
