version: 1
operators:
  pothole:
    name_zh: 路面坑槽
    tasks:
    - role: subject
      prompt: road surface
      expected_count: 1
    - role: hazard_source
      prompt: pothole on road surface
      expected_count: 4
    relation:
      type: overlap
      task_scope: all
    mask_strategy: object_only
    force_canonical_tasks: false
