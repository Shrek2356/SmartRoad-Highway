project_name: Site Safety OpenRisk Training-Free
random_seed: 42

risk_operators:
  path: configs/risk_operators.yaml

screening:
  enabled: true
  gate_camera: true
  scheduled_full_audit_minutes: 30
  allowed_full_audit_minutes: [30, 120]
  full_audit_on_first_frame: false
  device: 0
  imgsz: 640
  confidence: 0.25
  iou: 0.70
  trigger_threshold: 0.35
  proximity_threshold: 0.08
  max_regions: 16
  calibration_version: combine-yolo-v1
  models:
    - name: yolo26m_css_v28
      weights: ../../../yolo_site_workspace_portable/weights/yolo26m_css_v28_baseline_best.pt
    - name: yolo26m_construction_site
      weights: ../../../yolo_site_workspace_portable/weights/yolo26m_construction_site_best.pt

mllm:
  backend: openai_compatible
  api_key_env: DASHSCOPE_API_KEY
  base_url_env: QWEN_MLLM_BASE_URL
  model_env: QWEN_MLLM_MODEL
  timeout_seconds: 180
  max_retries: 3
  temperature: 0.1
  use_response_format: true
  trust_env: false
  # 视觉阶段只需严格JSON。关闭深度思考可降低延迟与Token成本。
  payload_extra:
    enable_thinking: false
  system_prompt: >-
    你是一名谨慎的施工现场视觉安全分析助手。只根据输入图像中的可见证据判断，
    不推测设备运行状态、人员权限、施工阶段或不可见信息。输出必须是严格JSON。

# 报告层默认复用同一份百炼 Key（无需再配智谱）
report_llm:
  enabled: true
  backend: openai_compatible
  api_key_env: DASHSCOPE_API_KEY
  base_url_env: QWEN_REPORT_BASE_URL
  model_env: QWEN_REPORT_MODEL
  timeout_seconds: 120
  max_retries: 3
  trust_env: false
  temperature: 0.1
  use_response_format: true
  memory_paths:
    - examples/risk_catalog.json
  system_prompt: >-
    你负责记忆库检索、报告整理和管理建议。视觉核验JSON是唯一视觉事实来源，
    不得改变风险是否成立、置信度、可见证据和人工复核要求。

sam3:
  backend: bridge
  bridge_module: integrations.sam3_bridge_user
  bridge_class: SAM3Bridge
  init_kwargs:
    repo_path: 'E:\SAM3_MAIN\sam3-main'
    checkpoint: 'E:\SAM3_MAIN\SAM3\sam3.pt'
    device: cuda
    confidence_threshold: 0.20
    amp_dtype: bfloat16

clip:
  enabled: true
  backend: bridge
  bridge_module: integrations.clip_bridge_user
  bridge_class: CLIPBridge
  init_kwargs:
    model_name: ViT-L-14
    checkpoint: 'C:\Users\SYS03\.cache\clip\ViT-L-14.pt'
    device: cuda
    precision: fp16
  minimum_consistency_score: 0.20

risk_catalog:
  path: examples/risk_catalog.json
  include_all_core: true
  distractor_count: 3
  allow_open_discovery: true

pipeline:
  segment_statuses: [present, uncertain]
  min_mllm_candidate_confidence: 0.25
  min_sam3_score: 0.20
  max_sam3_tasks: 24
  run_second_pass: true
  save_entity_masks: true
  save_risk_crops: true
  second_pass_max_overlays: 6
  relation_defaults:
    horizontal_overlap_threshold: 0.25
    near_distance_ratio: 0.30
    overlap_threshold: 0.10
    inside_threshold: 0.50
    allow_missing_from_non_detection: false
    allow_missing_from_visible_zone: true
    confirmed_absence_confidence_cap: 0.90
  mask_defaults:
    projected_width_expand_ratio: 0.15
    projected_max_object_height_ratio: 4.0
    projected_max_image_height_ratio: 0.55
